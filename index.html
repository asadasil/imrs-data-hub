<title>IMRS Data Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Unbounded:wght@600&display=swap">
<style>
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --surface-2: #e9eff0;
  --surface-3: #dde6e8;
  --ink: #132129;
  --ink-2: #3b4b54;
  --muted: #5f707a;
  --rule: #d4dfe1;
  --rule-strong: #a9b8bd;
  --accent: #0b6e78;
  --accent-soft: #dcefef;
  --accent-ink: #ffffff;
  --focus: #0b6e78;
  --ok-fg: #0b6b37; --ok-bg: #e0f2e7;
  --warn-fg: #7d5200; --warn-bg: #faefd6;
  --bad-fg: #9b2c25; --bad-bg: #fbe4e1;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --seq: #2a78d6;
  --grid: #e1e6e7;
  --font-display: "Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1518; --surface: #131f24; --surface-2: #182a30; --surface-3: #1f343b;
    --ink: #e4edef; --ink-2: #b8c6cb; --muted: #8b9ca3; --rule: #23353c; --rule-strong: #3b525a;
    --accent: #5cc6cf; --accent-soft: #123239; --accent-ink: #062125; --focus: #5cc6cf;
    --ok-fg: #7fd6a1; --ok-bg: #12301f; --warn-fg: #f0c46a; --warn-bg: #33270c; --bad-fg: #f19b92; --bad-bg: #3a1714;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --seq: #3987e5; --grid: #22343a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1518; --surface: #131f24; --surface-2: #182a30; --surface-3: #1f343b;
  --ink: #e4edef; --ink-2: #b8c6cb; --muted: #8b9ca3; --rule: #23353c; --rule-strong: #3b525a;
  --accent: #5cc6cf; --accent-soft: #123239; --accent-ink: #062125; --focus: #5cc6cf;
  --ok-fg: #7fd6a1; --ok-bg: #12301f; --warn-fg: #f0c46a; --warn-bg: #33270c; --bad-fg: #f19b92; --bad-bg: #3a1714;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --seq: #3987e5; --grid: #22343a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; } body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--muted); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 1440px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; }
.wordmark b { color: var(--accent); font-weight: 600; }
.brand small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab { border: 0; background: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 14px; }
.tab:hover { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.langs { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.langs button { border: 0; background: none; padding: 5px 9px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
@media (max-width: 760px) { .brand small { display: none; } .tabs { margin-left: 0; order: 3; width: 100%; } }

.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 60px; }

/* Search */
.search { display: grid; gap: 12px; margin-bottom: 14px; }
.search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qbox { position: relative; flex: 1 1 420px; min-width: 0; }
.qbox svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#q { width: 100%; font-size: 16px; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid var(--rule-strong); background: var(--surface); }
#q::placeholder { color: var(--muted); }
.stats { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters label { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.filters select { font-size: 13.5px; text-transform: none; letter-spacing: 0; color: var(--ink); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); max-width: 240px; }
.reset { align-self: flex-end; border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13.5px; padding: 6px 4px; }

/* Browse layout */
.browse { display: grid; gap: 18px; align-items: start; }
.browse { grid-template-columns: minmax(0, 1fr); }
.browse > * { min-width: 0; }
@media (min-width: 1000px) { .browse { grid-template-columns: minmax(340px, 0.9fr) minmax(0, 1.6fr); } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; min-width: 0; }
.results-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 8px; font-size: 13px; color: var(--muted); }
.results { list-style: none; margin: 0; padding: 0; }
.res { border-top: 1px solid var(--rule); }
.res button { display: grid; gap: 3px; width: 100%; text-align: left; padding: 11px 16px; border: 0; background: none; cursor: pointer; }
.res button:hover { background: var(--surface-2); }
.res[aria-current="true"] button { background: var(--accent-soft); }
.res-title { font-weight: 500; line-height: 1.35; }
.res-sub { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.more { display: block; width: 100%; padding: 12px; border: 0; border-top: 1px solid var(--rule); background: none; color: var(--accent); cursor: pointer; font-weight: 500; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.src { background: var(--accent-soft); color: var(--ink); white-space: normal; }
.badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
.badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
.badge.bad { background: var(--bad-bg); color: var(--bad-fg); }

/* Detail */
.detail { padding: 18px 20px 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.detail > *, .landing > * { min-width: 0; }
.tablewrap { max-width: 100%; }
.detail h2 { margin: 0; font-size: 1.3rem; line-height: 1.3; font-weight: 600; text-wrap: balance; }
.alt-names { font-size: 12.5px; color: var(--muted); display: grid; gap: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--rule-strong); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn svg { width: 15px; height: 15px; }
.prov { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.note { font-size: 13px; padding: 9px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-fg); }
.note.info { background: var(--surface-2); color: var(--ink-2); }
.section-title { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.picker { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.picker-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: var(--surface-2); }
.picker-head input { flex: 1 1 180px; min-width: 0; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); font-size: 13.5px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 2px; }
.rows { max-height: 220px; overflow: auto; list-style: none; margin: 0; padding: 4px 0; }
.rows li label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 12px; cursor: pointer; font-size: 13.5px; }
.rows li label:hover { background: var(--surface-2); }
.rows input { margin-top: 3px; accent-color: var(--accent); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; margin-top: 5px; }
.rowcode { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; margin-left: auto; padding-left: 8px; white-space: nowrap; }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); padding: 8px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.45; max-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.2); font-variant-numeric: tabular-nums; }
.tip b { font-weight: 600; }
.tip .tr { display: flex; gap: 8px; align-items: center; }
.tip .tr i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tablewrap { overflow: auto; border: 1px solid var(--rule); border-radius: 12px; max-height: 460px; background: var(--surface); }
table.data { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; width: max-content; min-width: 100%; }
table.data th, table.data td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; max-width: 320px; white-space: normal; min-width: 180px; }
table.data thead th { position: sticky; top: 0; background: var(--surface-2); font-weight: 600; font-size: 12px; color: var(--ink-2); z-index: 2; }
table.data thead th:first-child { z-index: 3; background: var(--surface-2); }
table.data.plain td, table.data.plain th { text-align: left; }
.meta-list { display: grid; gap: 8px; margin: 0; }
.meta-list div { display: grid; gap: 2px; }
.meta-list dt { font-size: 12px; font-weight: 600; color: var(--muted); }
.meta-list dd { margin: 0; font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
details.meta summary { cursor: pointer; font-weight: 600; font-size: 13.5px; padding: 4px 0; }
.empty { padding: 28px 20px; color: var(--muted); text-align: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); font-weight: 500; }
.back { display: none; }
.home { justify-self: start; }
@media (min-width: 1000px) {
  .detail-panel { position: sticky; top: calc(var(--top-h, 72px) + 10px); max-height: calc(100vh - var(--top-h, 72px) - 20px); overflow: auto; }
}
@media (max-width: 999px) {
  .home { display: none !important; }
  body.show-detail .results-panel { display: none; }
  body:not(.show-detail) .detail-panel { display: none; }
  body.show-detail .search { display: none; }
  .back { display: inline-flex; justify-self: start; }
}

/* Ask */
.askbtn { display: inline-flex; align-items: center; gap: 6px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); cursor: pointer; font-weight: 500; white-space: nowrap; }
.askbtn:hover { background: var(--surface); }
.ask { padding: 18px 20px 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.ask textarea { width: 100%; min-height: 78px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--surface); font-size: 15px; }
.ask-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.answer { white-space: pre-wrap; line-height: 1.6; font-size: 15px; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; }
.answer button.cite { border: 0; background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 0 5px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
.ask-status { font-size: 13px; color: var(--muted); }
.examples { display: flex; flex-wrap: wrap; gap: 6px; }
.examples button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }

/* Landing */
.landing { padding: 18px 20px 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.card { text-align: left; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.card:hover { border-color: var(--accent); }
.card strong { font-weight: 600; font-size: 14px; line-height: 1.3; }
.card span { font-size: 12.5px; color: var(--muted); }
.themes { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.theme { display: flex; justify-content: space-between; gap: 10px; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; background: var(--surface); cursor: pointer; text-align: left; }
.theme:hover { border-color: var(--accent); }
.theme span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.recent { list-style: none; margin: 0; padding: 0; display: grid; }
.recent li button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border: 0; border-top: 1px solid var(--rule); background: none; cursor: pointer; }
.recent li button:hover .rt { color: var(--accent); }
.recent .rd { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Sources & about */
.page { max-width: 1100px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.page > * { min-width: 0; }
.page h2 { margin: 0; font-size: 1.35rem; }
.page p { margin: 0; max-width: 72ch; color: var(--ink-2); }
.srcgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.srccard { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.srccard b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.srccard span { font-size: 13px; color: var(--muted); }
.skeleton { height: 14px; border-radius: 6px; background: var(--surface-2); margin: 10px 16px; }
@media (prefers-reduced-motion: no-preference) { .skeleton { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .5; } } }
.cc td { vertical-align: top; }
.cc .ccv { white-space: nowrap; font-variant-numeric: tabular-nums; }
.cc tr.on td { background: var(--accent-soft); }
.cc-detail { border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.cc-detail > * { min-width: 0; }
.cc-detail h3 { margin: 0; font-size: 1.1rem; }
.srcgroup { display: grid; gap: 10px; }
.srcgroup .subhead { margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: none; }
/* Nowcast */
.ncpage { max-width: 1280px; }
.ncnav { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.ncnav button { border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.ncnav button:hover { background: var(--surface-2); }
.ncnav button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.ncbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.ncbody > * { min-width: 0; }
.nchead h2 { margin: 0 0 4px; font-size: 1.35rem; }
.nchead p { font-size: 13px; }
.nchero { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .nchero { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
.nchl { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.nchl.rec { border: 2px solid var(--accent); background: var(--accent-soft); }
.ncbig { font-family: var(--font-display); font-size: 56px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
.ncrange { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.nckpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); align-content: start; }
.nckpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.nckpi b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.nckpi span { font-size: 12.5px; }
.nccomp .card { cursor: default; }
.card.on { border-color: var(--accent); background: var(--accent-soft); }
.ncv { font-size: 22px !important; font-variant-numeric: tabular-nums; }
.relbar { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; overflow: hidden; }
.relbar i { display: block; height: 100%; background: var(--c1); }
table.data tr.on td { background: var(--accent-soft); }
.ctl { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.labgrid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1000px) { .labgrid { grid-template-columns: minmax(320px, 0.85fr) minmax(0, 1.5fr); } }
.labgrid > * { min-width: 0; }
.labform { padding: 14px 16px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.fld { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.fld select, .fld input[type=text], .optrow select, .optrow input { font-size: 13.5px; font-weight: 400; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 100%; }
.optrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.optrow label { display: grid; gap: 3px; font-size: 12px; font-weight: 500; color: var(--muted); }
.optrow label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.optrow input[type=number] { width: 110px; }
.predlist { max-height: 300px; overflow: auto; border: 1px solid var(--rule); border-radius: 10px; padding: 6px 10px; display: grid; gap: 8px; }
.predblock { display: grid; gap: 2px; }
.predblock b { font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  out.sort(function (a, b) { return b.s - a.s || (b.d.lp || "").localeCompare(a.d.lp || ""); });
  return { region: region, items: out.slice(0, limit || 12).map(function (x) { return x.d; }) };
}
var ASK_TOOLS = [
  { name: "search_datasets",
    description: "Search the IMRS Data Hub catalogue of official public data on Uzbekistan: Statistics Agency (SIAT tables, open data, SDG, gender, regional departments), Central Bank, Ministry of Economy and Finance (budget, debt), the currency, stock and commodity exchanges, procurement, state assets, ministries and khokimiyats on gov.uz, plus international second sources (World Bank, IMF, ADB, ILO, UN). Returns up to 12 datasets: id, name, publisher, whether the publisher is national or international, frequency, first and last period, number of series, unit, and whether rows include regions or districts. Use short keyword queries in English or Russian; a region name in the query keeps only tables with regional rows.",
    inputSchema: { type: "object", properties: { query: { type: "string" }, regional_only: { type: "boolean" } }, required: ["query"] },
    execute: function (input) {
      var q = String(input.query || "");
      askStep("search", q);
      var r = searchCatalog(q, !!input.regional_only, 12);
      return { region_code: r.region, datasets: r.items.map(function (d) { return { id: d.id, name: d.n[0] || d.n[1] || d.n[2], publisher: srcShort(d.s), publisher_type: isIntl(d.s) ? "international estimate" : "national official", frequency: d.f, first: d.fp, last: d.lp, series: d.ns, breakdown: d.r === 2 ? "regions and districts" : d.r === 1 ? "regions" : "national", unit: d.u }; }) };
    } },
  { name: "get_data",
    description: "Get values from one dataset by id. Returns unit, the latest periods, and the rows (series) whose label or code contains `series` (for example a region name, 'Republic of Uzbekistan', a product or currency code); without `series` it returns the first rows. Each row's values align with `periods`; null means no value.",
    inputSchema: { type: "object", properties: { dataset_id: { type: "string" }, series: { type: "string" }, periods: { type: "integer", description: "Number of latest periods, default 12, at most 40" } }, required: ["dataset_id"] },
    execute: function (input) {
      var id = String(input.dataset_id || ""), d = BYID[id];
      if (!d) throw new Error("Unknown dataset id " + id + ". Use search_datasets first.");
      askStep("read", id);
      return loadShard(d.sh).then(function (sh) {
        var data = sh[id];
        if (!data.r) {
          var f = norm(String(input.series || ""));
          var rows = data.rows.filter(function (r) { return !f || norm(r.join(" ")).indexOf(f) >= 0; }).slice(0, 25);
          return { id: id, name: d.n[0], publisher: srcFull(d.s), columns: data.cols, rows: rows, total_rows: data.rows.length, page: data.m.page };
        }
        var n = Math.max(1, Math.min(40, parseInt(input.periods, 10) || 12));
        var want = norm(String(input.series || "")), reg = null;
        want.split(" ").forEach(function (tk) { var r = regionOf(tk); if (r) reg = r; });
        var picked = [];
        data.r.forEach(function (r, i) {
          var hay = norm((r.l || []).join(" ") + " " + (r.c || r.k));
          if (!want || hay.indexOf(want) >= 0 || (reg && String(r.c || r.k) === reg)) picked.push(i);
        });
        if (!picked.length) picked = data.r.slice(0, 1).map(function (_, i) { return i; });
        picked.sort(function (a, b) {
          function rank(k) { var c = String(data.r[k].c || data.r[k].k); return c === reg ? 0 : c === "1700" ? 1 : /^17\d\d$/.test(c) ? 2 : 3; }
          return rank(a) - rank(b) || a - b;
        });
        picked = picked.slice(0, 15);
        var cols = [];
        for (var i = data.p.length - 1; i >= 0 && cols.length < n; i--) { if (picked.some(function (k) { return data.r[k].v[i] != null; })) cols.push(i); }
        cols.reverse();
        var ytd = YTD_IDS[id] || data.p.some(function (p) { return /-C\d\d$/.test(p); });
        return { id: id, name: d.n[0], publisher: srcFull(d.s), unit: pick(data.m.unit) || d.u, updated_at_source: data.m.src_upd, page: data.m.page,
          period_basis: ytd ? "Year to date: each value covers January to the end of its period (Q1 = January-March, Q2 = January-June, Q3 = January-September, Q4 = the whole year; a monthly value = January to that month); growth rates in such tables compare with the same months a year earlier." : undefined,
          total_series: data.r.length, periods: cols.map(function (i) { return data.p[i]; }),
          series: picked.map(function (k) { var r = data.r[k]; return { label: r.l[0] || r.l[1] || r.k, code: r.c || r.k, unit: r.u || undefined, values: cols.map(function (i) { return r.v[i]; }) }; }) };
      });
    } }
];
/* SIAT tables published cumulatively from January (national accounts by quarter, monthly industry,
   construction, trade and services growth): get_data says so, because the dataset names do not. */
var YTD_IDS = { "siat-3695": 1, "siat-3696": 1, "siat-3698": 1, "siat-3699": 1, "siat-3700": 1, "siat-562": 1, "siat-577": 1, "siat-2406": 1, "siat-2696": 1, "siat-2700": 1, "siat-3216": 1 };
/* Where to look first: well-known tables, so the answer does not depend on search luck. */
var ASK_GUIDE = "Tables to try first (check the unit and the period returned):\n" +
  "- Inflation, % compared with the same month a year earlier: siat-4689 (series 'Cumulative index' is all items; by region: siat-4692). Since December: siat-4688. Month on month: siat-1286. Core inflation: cbu-st-bulletin-1-3.\n" +
  "- Central Bank policy rate: cbu-policy-rate. Official exchange rates (daily, series USD, EUR, RUB): cbu-fx-daily.\n" +
  "- GDP: annual growth siat-582, annual level siat-1920; quarterly growth siat-3698 and level siat-3695. SIAT's quarterly GDP and most monthly growth rates (industry siat-577, construction siat-2406, retail siat-2700, services siat-3216) are cumulative from January: a Q2 value covers January to June compared with January to June of the previous year. Say so when you quote them.\n" +
  "- Unemployment by region (annual): siat-1875. Resident population: siat-246. Budget: ob-consolidated-budget. Public debt: ob-debt-overview. Merchandise trade: nsdp-met.\n" +
  "Index values (100 = no change) are growth plus 100: quote 106.2 as '6.2% higher than a year earlier', never as '106.2% inflation'.\n";
function askStatus(msg) { var el = $("ask-status"); if (el) el.textContent = msg; }
/* With tools, the text Claude writes before each tool call (its working notes) arrives in the same
   stream as the answer. Everything written before the last tool call is cut from what is shown. */
function askStep(kind, what) {
  ASK.cut = (ASK.live || "").length;
  ASK.steps.push(kind === "search" ? "🔎 " + what : "📄 " + what);
  askStatus(kind === "search" ? t("searching", { q: what }) : t("reading", { n: BYID[what] ? dsName(BYID[what]) : what }));
  showSteps();
}
function showSteps() { var el = $("ask-steps"); if (el) { el.hidden = !ASK.steps.length; el.textContent = t("ask_steps", { s: ASK.steps.join(" · ") }); } }
function answerPart(text) { var a = String(text || "").slice(ASK.cut || 0).replace(/^\s+/, ""); return a || String(text || "").trim(); }
function renderAsk() {
  state.sel = null; state.askOpen = true;
  if (isNarrow() && !document.body.classList.contains("show-detail")) state.listY = window.scrollY;
  document.body.classList.add("show-detail");
  var ex = [["Unemployment in Samarkand region since 2020", "Безработица в Самаркандской области с 2020 года", "2020-yildan beri Samarqand viloyatida ishsizlik", "2020 йилдан бери Самарқанд вилоятида ишсизлик"],
    ["Latest inflation and the policy rate", "Последняя инфляция и основная ставка", "So'nggi inflyatsiya va asosiy stavka", "Сўнгги инфляция ва асосий ставка"],
    ["Which regions grew industry fastest this year?", "Где быстрее всего растёт промышленность в этом году?", "Bu yil sanoat qaysi hududlarda tez o'sdi?", "Бу йил саноат қайси ҳудудларда тез ўсди?"]];
  $("detail").innerHTML = '<div class="ask">' + backBtns() + "<h2 style=\"margin:0;font-size:1.25rem\">" + esc(t("ask_title")) + '</h2><textarea id="ask-q" placeholder="' + esc(t("ask_ph")) + '">' + esc(ASK.q) + '</textarea><div class="examples">' + ex.map(function (e) { return "<button data-ex=\"" + esc(pick(e)) + "\">" + esc(pick(e)) + "</button>"; }).join("") + '</div><div class="ask-row"><button class="btn primary" id="ask-go">' + esc(t("ask_btn")) + '</button><button class="btn" id="ask-stop" hidden>' + esc(t("stop")) + '</button><span class="ask-status" id="ask-status"></span></div><div class="answer" id="ask-out" hidden></div><p class="muted" id="ask-steps" style="margin:0;font-size:12.5px" hidden></p><p class="muted" style="margin:0;font-size:12.5px">' + esc(t("ask_note")) + "</p></div>";
  bindBack();
  if (ASK.text) showAnswer(ASK.text);
  showSteps();
  if (ASK.msg) askStatus(ASK.msg);
  Array.prototype.forEach.call(document.querySelectorAll("[data-ex]"), function (b) { b.onclick = function () { $("ask-q").value = b.getAttribute("data-ex"); $("ask-q").focus(); }; });
  $("ask-go").onclick = runAsk;
  $("ask-stop").onclick = function () { if (ASK.ctl) ASK.ctl.abort(); };
  $("ask-q").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) runAsk(); });
  detailToTop();
  try { $("ask-q").focus({ preventScroll: true }); } catch (e) {}
}
function showAnswer(text) {
  var el = $("ask-out"); if (!el) return;
  el.hidden = !String(text || "").trim();
  el.innerHTML = esc(text).replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/^#{1,4} +/gm, "")
    .replace(/\[([a-z]+(?:-[A-Za-z0-9._]+)+)\]/g, function (m, id) { return BYID[id] ? '<button class="cite" data-open="' + id + '">' + id + "</button>" : m; });
}
function runAsk() {
  var q = ($("ask-q").value || "").trim(); if (!q) { $("ask-q").focus(); return; }
  if (!SAMPLE) { askStatus(t("ask_off")); return; }
  ASK.q = q; ASK.text = ""; ASK.live = ""; ASK.cut = 0; ASK.steps = []; ASK.msg = "";
  showAnswer(""); showSteps();
  var lang = ["English", "Russian", "Uzbek (Latin script)", "Uzbek (Cyrillic script)"][L()];
  var prompt = "You answer questions about the official statistics of Uzbekistan for researchers at the Institute for Macroeconomic and Regional Studies, using ONLY the IMRS Data Hub tools. " +
    "Call the tools first and write nothing before your final answer. Use search_datasets (short keyword queries, try English and Russian terms) and get_data; prefer the most recent and most specific table, and prefer national official publishers; use international estimates (World Bank, IMF, ADB, ILO, UN) only as second sources and say so. " +
    "Then answer in " + lang + " in 2 to 6 sentences: give the key numbers with units and periods, and mention the publisher. Cite every dataset you used as [dataset-id], for example [siat-544]. Write plain text: no Markdown (no **, #, tables or bullet symbols). When get_data returns period_basis, describe the figures that way (for example 'January-June 2026 compared with January-June 2025'). " +
    "Report numbers exactly as returned; do not estimate or invent. Growth tables often give an index where 100 means no change (108.5 = +8.5%); say which comparison a figure is (year on year, since December, month on month, or year to date). If the hub has no suitable data, say so plainly.\n\n" +
    ASK_GUIDE + "\nToday is " + new Date().toISOString().slice(0, 10) + ".\n\nQuestion: " + q;
  ASK.ctl = new AbortController();
  $("ask-go").disabled = true; $("ask-stop").hidden = false; askStatus(t("thinking"));
  function done() { var g = $("ask-go"); if (g) { g.disabled = false; $("ask-stop").hidden = true; } }
  var call;
  try { call = SAMPLE(prompt, { tools: ASK_TOOLS, signal: ASK.ctl.signal, onText: function (u) { ASK.live = u.text; ASK.text = answerPart(u.text); showAnswer(ASK.text); } }); }
  catch (e) { call = Promise.reject({ code: "upstream_error", message: String(e && e.message || e) }); }
  Promise.resolve(call)
    .then(function (r) { ASK.live = r.text; ASK.text = answerPart(r.text); showAnswer(ASK.text); askStatus(r.truncated ? t("ask_err", { c: "truncated" }) : ""); },
      function (e) {
        e = e || {};
        if (e.text) { ASK.text = answerPart(e.text); showAnswer(ASK.text); }
        if (e.code === "cancelled") { askStatus(""); return; }
        var msg = e.code === "not_granted" ? t("ask_denied") : (e.code === "sampling_disabled" || e.code === "tools_unavailable" || e.code === "not_declared" || e.code === "capability_disabled" || e.code === "capability_removed") ? t("ask_off")
          : e.code === "rate_limited" ? t("ask_limit") : e.code === "session_expired" ? t("ask_signin") : t("ask_err", { c: e.code || "error" });
        ASK.msg = msg; askStatus(msg);
        if (window.console) console.warn("Ask the data:", e.code, e.message);
      })
    .then(done, done);
}
$("askbtn").addEventListener("click", function () { if (state.view !== "browse") setView("browse"); renderAsk(); });

/* ---------- events ---------- */
var qTimer;
$("q").addEventListener("input", function (e) { clearTimeout(qTimer); qTimer = setTimeout(function () { state.q = e.target.value; state.shown = 50; search(); renderResults(); }, 120); });
$("results").addEventListener("click", function (e) { var li = e.target.closest(".res"); if (li) openDataset(li.getAttribute("data-id")); });
$("more").addEventListener("click", function () { state.shown += 50; renderResults(); });
$("detail").addEventListener("click", function (e) {
  var o = e.target.closest("[data-open]"); if (o) { openDataset(o.getAttribute("data-open")); return; }
  var cc = e.target.closest("[data-ccopen]"); if (cc) { openCC(+cc.getAttribute("data-ccopen")); return; }
  var th = e.target.closest("[data-theme]"); if (th) { state.f.t = th.getAttribute("data-theme"); state.shown = 50; search(); renderFilters(); renderResults(); renderLanding(); }
});
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) { b.addEventListener("click", function () {
  var v = b.getAttribute("data-view");
  if (v === "browse" && state.view === "browse" && CAT && (state.sel || state.askOpen)) { closeDetail(); window.scrollTo(0, 0); return; }   // Browse again = back to the overview
  setView(v);
}); });
Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) { b.addEventListener("click", function () { state.lang = b.getAttribute("data-lang"); try { localStorage.setItem("uzdh-lang", state.lang); } catch (e) {} applyLang(); }); });
var rsT; window.addEventListener("resize", function () { clearTimeout(rsT); rsT = setTimeout(function () { setTopHeight(); if (state.sel && VIEW.data) { drawChart(BYID[state.sel], VIEW.data); drawRegions(BYID[state.sel], VIEW.data); } }, 150); });
/* Errors never fail silently: the viewer sees what went wrong. */
var lastErr = 0;
function reportError(msg) { if (Date.now() - lastErr < 4000) return; lastErr = Date.now(); try { toast(t("err_any", { m: String(msg || "error").slice(0, 160) })); } catch (e) {} }
window.addEventListener("error", function (e) { if (e && e.message) reportError(e.message); });
window.addEventListener("unhandledrejection", function (e) { var r = e && e.reason; if (r && r.code === "cancelled") return; reportError(r && (r.message || r.code) || r); });

function routeHash() {
  var h = (location.hash || "").replace("#", "");
  if (h.indexOf("d-") === 0 && BYID[h.slice(2)]) { if (state.view !== "browse") setView("browse"); if (state.sel !== h.slice(2)) openDataset(h.slice(2), false); }
  else if (h.indexOf("c-") === 0) { loadCC().then(function () { var i = +h.slice(2); if (CC.indicators[i]) { CC_OPEN = i; setView("compare", true); } }, function () {}); }
  else if (h === "sources" || h === "about" || h === "browse" || h === "compare") setView(h);
  else if (h === "nowcast" || h.indexOf("nowcast/") === 0) setView("nowcast", true, h.slice(8) || "overview");
}
window.addEventListener("hashchange", function () { if (CAT) routeHash(); });

/* ---------- helpers shared with nowcast.js ---------- */
window.HUB = {
  esc: esc, t: t, pick: pick, nf: nf, big: big, L: L, state: state, niceTicks: niceTicks, getJSON: getJSON, loadShard: loadShard,
  byId: function (id) { return BYID[id]; }, cat: function () { return CAT; }, sample: function () { return SAMPLE; },
  save: function (name, data) { if (!DL && NATIVE) { nativeSave(name, data); return; } if (!DL) { allowDownloads(function () { saveFile(name, data); }); return; } saveFile(name, data); },
  allowDownloads: allowDownloads,
  toast: toast, fmtPeriod: fmtPeriod, srcShort: srcShort, dsName: dsName, searchCatalog: searchCatalog, tip: function () { return $("tip"); },
  openDataset: function (id) { setView("browse"); openDataset(id); },
  xlsx: withXlsx, canSave: function () { return !!DL || NATIVE; }
};

/* ---------- turning downloads on for a viewer who has them off ---------- */
var CAN_ASK = !!(window.claude && typeof window.claude.use === "function");
var NATIVE = !CAN_ASK;
function redrawDetail() { if (state.sel && VIEW.data) drawDetail(BYID[state.sel], VIEW.data); }
function recheckDownloads(then, reloadIfNull) {
  window.claude.use("downloads").then(function (ns) {
    if (ns) { DL = ns; redrawDetail(); if (then) then(); }
    else if (reloadIfNull) { try { location.reload(); } catch (e) { toast(t("dl_still_off")); } }
    else toast(t("dl_unavail"), 12000);
  }, function () { toast(t("dl_unavail"), 12000); });
}
/* The permission state says why downloads are off: "unavailable" = this view cannot save files at all
   (nothing the viewer can switch on), "denied" = refused earlier (the Permissions panel turns it back on),
   "prompt" = ask now, "granted" = allowed, so a reload picks it up. */
function allowDownloads(then) {
  if (typeof then !== "function") then = null;
  if (!CAN_ASK) { toast(t("dl_unavail"), 12000); return; }
  window.claude.use("permissions").then(function (P) {
    if (!P) { toast(t("dl_unavail"), 12000); return; }
    P.state("downloads").then(function (st) {
      if (window.console) console.info("downloads permission:", st);
      if (st === "unavailable") { toast(t("dl_unavail"), 12000); return; }
      if (st === "granted") { recheckDownloads(then, true); return; }
      if (st === "denied") { P.manage().then(function () { P.state("downloads").then(function (s2) { if (s2 === "granted") recheckDownloads(then, true); else toast(t("dl_still_off")); }); }, function () { toast(t("dl_still_off")); }); return; }
      P.request(["downloads"]).then(function (r) { var s2 = r && r.downloads; if (s2 === "granted") recheckDownloads(then, true); else if (s2 === "unavailable") toast(t("dl_unavail"), 12000); else toast(t("dl_still_off")); }, function () { toast(t("dl_still_off")); });
    }, function () { toast(t("dl_unavail"), 12000); });
  }, function () { toast(t("dl_unavail"), 12000); });
}

/* ---------- boot ---------- */
applyLang();
setTopHeight();
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(function (ns) { DL = ns || null; if (state.sel && VIEW.data) drawDetail(BYID[state.sel], VIEW.data); }, function () {});
  window.claude.use("sample").then(function (fn) {
    if (!fn) return;
    fn.limits().then(function (lim) { if (lim && lim.tools) { SAMPLE = fn; $("askbtn").hidden = false; } }, function () {});
  }, function () {});
}
getJSON("data/catalog.gz.txt").then(function (cat) {
  CAT = cat; buildIndex(); search(); applyLang();
  routeHash();
  loadCC().then(function () { if (state.sel && VIEW.data && VIEW.id === state.sel) drawDetail(BYID[state.sel], VIEW.data); }, function () {});
  fetch("data/status.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (s) { STATUS = s; if (state.view === "sources") renderSources(); }, function () {});
}).catch(function (e) {
  $("results").innerHTML = '<li class="empty">Could not load the catalogue (' + esc(e.message) + "). Reload the page to try again.</li>";
  $("stats").textContent = "";
});
})();
</script>
